<div
	id="resume-wrapper"
	class="max-w-4xl mx-auto mt-10 px-6 md:px-12"
>
	<div class="h-20"></div>

	{% if id.is_some() %}
	<div
		class="border-(--border) flex items-center justify-between
		pb-4 border-b font-mono text-xs"
	>
		<span class="text-(--ink-soft)">Resume</span>

		<a
			href="/api/data/resume/download"
			download
			class="border-(--border) text-(--ink-soft) font-mono text-xs
			px-3 py-1.5 rounded-sm border cursor-pointer"
		>
			Download
		</a>
	</div>

	<div class="border-(--border) mt-6 rounded-sm border overflow-hidden">
		<object
			data="/api/data/resume"
			type="application/pdf"
			class="w-full h-[80vh]"
		>
			<div
				class="text-(--ink-soft) font-mono text-xs p-6 text-center"
			>
				Your browser can't display this PDF.
				<a
					href="/api/data/resume"
					class="text-(--secondary) underline"
					>Open it directly</a
				>
			</div>
		</object>
	</div>
	{% else %}
	<div
		class="border-(--border) text-(--ink-soft) flex items-center
		justify-center font-mono text-sm mt-6 py-20 rounded-sm border
		border-dashed"
	>
		No resume available
	</div>
	{% endif %}
</div>
