{% macro education_entry(title, date, institution, score) %}
	<li class="mb-10">
		<span
			class="absolute -left-1.5 w-3 h-3 rounded-full"
			style="background: var(--secondary)"
		></span>
		<div class="flex flex-wrap items-baseline justify-between gap-x-4">
			<h3 class="font-serif text-xl" style="color: var(--ink)">
				{{ title }}
			</h3>
			<span class="font-mono text-sm" style="color: var(--ink-soft)"
				>{{ date }}
			</span>
		</div>
		<p class="text-sm mt-1" style="color: var(--ink-soft)">{{ institution }}</p>
		<p class="text-sm mt-2 font-mono" style="color: var(--ink)">{{ score }}</p>
	</li>
{% endmacro %}
