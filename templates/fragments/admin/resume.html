<title>Resume | Admin</title>

<div
	id="resume-wrapper"
	class="max-w-4xl mx-auto mt-10 px-6 md:px-12"
>
	<div class="h-20"></div>

	<form
		action="/admin/resume"
		hx-post="/admin/resume"
		hx-target="#resume-wrapper"
		hx-encoding="multipart/form-data"
		class="border-(--border) flex flex-wrap items-center gap-3
		pb-4 border-b font-mono text-xs"
	>
		<label for="doc" class="text-(--ink-soft)">Upload new</label>

		<input
			id="doc"
			type="file"
			name="doc"
			accept="application/pdf"
			required
			class="text-(--ink-soft) flex-1 min-w-0
			file:border-(--border) file:text-(--ink-soft) file:font-mono
			file:text-xs file:px-3 file:py-1.5 file:mr-3 file:rounded-sm
			file:border file:bg-transparent file:cursor-pointer"
		/>

		<button
			type="submit"
			class="border-(--border) text-(--ink-soft) font-mono text-xs
			px-3 py-1.5 rounded-sm border cursor-pointer"
		>
			{% if id.is_some() %}Replace{% else %}Upload{% endif %}
		</button>
	</form>

	{% if id.is_some() %}
	<div class="border-(--border) mt-6 rounded-sm border overflow-hidden">
		<object
			data="/api/data/resume"
			type="application/pdf"
			class="w-full h-[80vh]"
		>
			<div
				class="text-(--ink-soft) font-mono text-xs p-6 text-center"
			>
				Your browser can't display this PDF.
				<a
					href="/api/data/resume"
					class="text-(--secondary) underline"
					>Open it directly</a
				>
			</div>
		</object>
	</div>
	{% else %}
	<div
		class="border-(--border) text-(--ink-soft) flex items-center
		justify-center font-mono text-sm mt-6 py-20 rounded-sm border
		border-dashed"
	>
		No resume uploaded
	</div>
	{% endif %}
</div>
