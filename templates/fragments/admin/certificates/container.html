{% import "components/macros.html" as macros %}
<div class="max-w-4xl mx-auto px-6 md:px-12 py-16">
	<div class="mb-16">
		<h2 class="text-(--ink) font-serif text-2xl mb-6">
			Add new certificate
		</h2>

		<form
			hx-post="/admin/certificates"
			hx-encoding="multipart/form-data"
			hx-target="#certificates-table-wrapper"
			hx-swap="outerHTML"
			class="w-full grid grid-cols-1 sm:grid-cols-2 gap-5 max-w-2xl"
		>
			<div class="flex flex-col gap-1">
				<label for="name" class="text-(--ink-soft) font-mono text-xs"
					>Name</label
				>
				<input
					type="text"
					id="name"
					name="name"
					required
					class="border-(--border) text-(--ink) border rounded-sm
					px-3 py-2 text-sm bg-transparent outline-none focus:ring-2"
				/>
			</div>

			<div class="flex flex-col gap-1">
				<label for="issuer" class="text-(--ink-soft) font-mono text-xs"
					>Issuer</label
				>
				<input
					type="text"
					id="issuer"
					name="issuer"
					required
					class="border-(--border) text-(--ink) border rounded-sm
					px-3 py-2 text-sm bg-transparent outline-none focus:ring-2"
				/>
			</div>

			<div class="flex flex-col gap-1">
				<label for="date" class="text-(--ink-soft) font-mono text-xs"
					>Date</label
				>
				<input
					type="date"
					id="date"
					name="date"
					required
					class="border-(--border) text-(--ink) border rounded-sm
					px-3 py-2 text-sm bg-transparent outline-none focus:ring-2"
				/>
			</div>

			<div class="flex flex-col gap-1" x-data="{ addingNew: {{ categories.is_empty() }} }">
				<label
					for="category"
					class="text-(--ink-soft) font-mono text-xs"
					>Category</label
				>

				<select
					id="category"
					name="category"
					x-ref="selection"
					x-show="!addingNew"
					:required="!addingNew"
					:disabled="addingNew"
					@change="addingNew = $event.target.value === '__new__'"
					class="border-(--border) text-(--ink) border rounded-sm
					px-3 py-2 text-sm bg-transparent outline-none focus:ring-2"
				>
					{% for category in categories %}
					<option value="{{ category }}">{{ category }}</option>
					{% endfor %}
					<option value="__new__">+ New category&hellip;</option>
				</select>

				<div x-show="addingNew" x-cloak class="flex gap-2">
					<input
						type="text"
						name="category"
						placeholder="New category name"
						:required="addingNew"
						:disabled="!addingNew"
						class="border-(--border) text-(--ink) border rounded-sm
						px-3 py-2 text-sm bg-transparent outline-none focus:ring-2 flex-1"
					/>
					<button
						type="button"
						@click="addingNew = false; $refs.selection.selectedIndex = 0"
						class="border-(--border) text-(--ink-soft) font-mono text-xs px-3 rounded-sm border"
					>
						Cancel
					</button>
				</div>
			</div>

			<div class="flex flex-col gap-1 sm:col-span-2">
				<label for="image_file" class="text-(--ink-soft) font-mono text-xs"
					>Certificate file</label
				>
				<input
					type="file"
					id="image_file"
					name="image"
					accept="application/pdf,image/*"
					required
					class="border-(--border) text-(--ink-soft) font-mono px-3 py-2
					text-sm bg-transparent outline-none focus:ring-2"
				/>
			</div>

			<div class="sm:col-span-2">
				<button
					type="submit"
					class="bg-(--primary) border-(--border) text-(--ink-soft)
					font-mono text-sm px-5 py-2.5 rounded-sm"
				>
					Add certificate
				</button>
			</div>
		</form>
	</div>

	{% include "fragments/admin/certificates/table.html" %}

	{% call macros::modal() %}
	<div id="image-container" class="max-w-4xl mx-auto opacity-100">
		<img
			alt="displayed certificate"
			class="max-w-full"
			x-ref="image"
			:src="imageUrl"
			x-init="$watch('imageUrl', _ => open = true)"
		/>
	</div>
	{% endcall %}
</div>
