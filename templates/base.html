<!doctype html>
<html 
	lang="en"
	data-theme="dark"
	:data-theme="theme"
	x-data="{ theme: $persist('dark') }">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Home | Parth Bathe{% endblock title %}</title>
		<link rel="stylesheet" href="/static/css/styles.css" />
		<style>
			:root {
				--bg: #eaf2ed;
				--nav-bg: #dce6df;
				--surface: #ffffff;
				--ink: #1a1d2e;
				--ink-soft: #464b71;
				--primary: #464b71;
				--secondary: #118ab2;
				--accent: #7cd5c7;
				--border: #464b7133;
			}
			[data-theme="dark"] {
				--bg: #18230f;
				--nav-bg: #101a0a;
				--surface: #27391c;
				--ink: #eaf2e9;
				--ink-soft: #b9cdb7;
				--primary: #1f7d53;
				--secondary: #255f38;
				--accent: #7cd5c7;
				--border: #7cd5c733;
			}
			
			body {
				transition:
					background 0.2s ease,
					color 0.2s ease;
			}
		</style>
	</head>
	<body class="bg-(--nav-bar) text-(--ink) min-h-screen">
		{% block navbar %}
			{% include "fragments/navbar.html" %}
		{% endblock navbar %}
		<main>
			{% block content %} 
				{% include "fragments/home.html" %} 
			{% endblock content %}
		</main>
		<footer class="bg-(--nav-bg) text-(--ink-soft) border-(--border) border-t mt-8 p-4 text-center text-sm">
			<nav class="flex flex-wrap justify-center gap-4">
				<a href="mailto:parth.bathe0142@gmail.com" class="hover:underline">Email</a>
				<a href="https://github.com/Parth-bathe0142" class="hover:underline">GitHub</a>
				<a href="https://www.linkedin.com/in/parth-bathe-65659725b" class="hover:underline">LinkedIn</a>
				<a href="/resume" hx-get="/resume" hx-target="main" hx-swap="innerHTML" hx-push-url="/resume" class="hover:underline">Resume</a>
			</nav>
			<p class="mt-2">
				© 2026 Parth Bathe · Built with Rust, Axum, Askama, HTMX and Alpine ·
				<a href="https://github.com/Parth-bathe0142/Portfolio" class="hover:underline">Source</a>
			</p>
		</footer>
	</body>
	<script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"></script>
	<script src="https://unpkg.com/htmx.org@4.0.0/dist/ext/hx-alpine-compat.js"></script>
	
	<script defer src="https://unpkg.com/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</html>
